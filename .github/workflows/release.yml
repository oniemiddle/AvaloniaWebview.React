name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Validate package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "<AvaloniaReactVersion>${version}</AvaloniaReactVersion>" Directory.Build.props
          node -e "const p = require('./client/package.json'); const l = require('./client/package-lock.json'); if (p.version !== '${version}') { console.error('client/package.json version ' + p.version + ' does not match ' + '${version}'); process.exit(1); } if (l.version !== '${version}' || l.packages[''].version !== '${version}') { console.error('client/package-lock.json version does not match ${version}'); process.exit(1); }"
      - name: Test control package
        run: dotnet test tests/AvaloniaWebview.React.Tests/AvaloniaWebview.React.Tests.csproj -c Release --nologo -v minimal
      - name: Test source generator
        run: dotnet test tests/AvaloniaWebview.React.SourceGenerator.Tests/AvaloniaWebview.React.SourceGenerator.Tests.csproj -c Release --nologo -v minimal
      - name: Build and test bridge client
        run: |
          npm --prefix client ci
          npm --prefix client run build
          npm --prefix client test
          npm --prefix client run verify:package
      - name: Pack NuGet packages
        run: |
          dotnet pack src/AvaloniaWebview.React/AvaloniaWebview.React.csproj -c Release -o artifacts/packages --nologo
          dotnet pack src/AvaloniaWebview.React.Vite/AvaloniaWebview.React.Vite.csproj -c Release -o artifacts/packages --nologo
          dotnet pack src/AvaloniaWebview.React.SourceGenerator/AvaloniaWebview.React.SourceGenerator.csproj -c Release -o artifacts/packages --nologo
          pwsh -NoProfile -ExecutionPolicy Bypass -File eng/verify-nuget-packages.ps1
      - name: Pack bridge client
        run: |
          mkdir -p artifacts/packages
          cd client
          npm pack --pack-destination ../artifacts/packages
      - name: Authenticate to nuget.org with Trusted Publishing
        if: ${{ env.NUGET_USER != '' }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}
      - name: Publish to NuGet
        if: ${{ env.NUGET_USER != '' }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push artifacts/packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push artifacts/packages/*.snupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Publish bridge client to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          cd client
          npm publish --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/packages/*.nupkg artifacts/packages/*.snupkg artifacts/packages/*.tgz --generate-notes --title "$GITHUB_REF_NAME"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test control package
        run: dotnet test tests/AvaloniaWebview.React.Tests/AvaloniaWebview.React.Tests.csproj -c Release --nologo -v minimal
      - name: Test source generator
        run: dotnet test tests/AvaloniaWebview.React.SourceGenerator.Tests/AvaloniaWebview.React.SourceGenerator.Tests.csproj -c Release --nologo -v minimal
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install bridge client
        run: npm --prefix client ci
      - name: Build bridge client
        run: npm --prefix client run build
      - name: Test bridge client
        run: npm --prefix client test
      - name: Verify bridge package manifest
        run: npm --prefix client run verify:package
      - name: Build cross-platform sample
        if: matrix.os == 'ubuntu-latest'
        run: dotnet build samples/ReactHost/ReactHost.csproj -c Release -f net10.0 --nologo -v minimal -p:AvaloniaReactBuildOnBuild=false -p:AvaloniaReactAutoStart=false

  pack:
    name: Pack packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build bridge client
        run: |
          npm --prefix client ci
          npm --prefix client run build
          npm --prefix client test
      - name: Pack
        run: |
          dotnet pack src/AvaloniaWebview.React/AvaloniaWebview.React.csproj -c Release -o artifacts/packages --nologo
          dotnet pack src/AvaloniaWebview.React.Vite/AvaloniaWebview.React.Vite.csproj -c Release -o artifacts/packages --nologo
          dotnet pack src/AvaloniaWebview.React.SourceGenerator/AvaloniaWebview.React.SourceGenerator.csproj -c Release -o artifacts/packages --nologo
          mkdir -p artifacts/packages
          cd client
          npm pack --pack-destination ../artifacts/packages
      - name: Verify package contents
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File eng/verify-nuget-packages.ps1
          npm --prefix client run verify:package
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/*.tgz
          if-no-files-found: error
